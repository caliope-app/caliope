name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Caliope version
      description: Settings → Version.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: From %LOCALAPPDATA%\Caliope\logs. Remove tokens and private paths first.
      render: text
