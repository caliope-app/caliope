# Once a day: when Node.js has a security release newer than the Node.js in the latest Caliope release, publishes
# a new patch version through release.yml, with the same tests and checks. Installed copies see it in their
# update check. A failed run publishes nothing, and the next day's run tries again.
name: Node.js security

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.compare.outputs.node }}
    steps:
      - name: Compare with nodejs.org
        id: compare
        run: |
          node --input-type=module >> "$GITHUB_OUTPUT" <<'EOF'
          const manifest = await (await fetch(`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/manifest.json`)).json();
          const releases = await (await fetch('https://nodejs.org/dist/index.json')).json();
          // Newest first. A new major version stays a choice of its own.
          const sameMajor = releases.filter(({ version }) => version.startsWith(`v${String(manifest.node).split('.')[0]}.`));
          const newer = sameMajor.slice(0, sameMajor.findIndex(({ version }) => version === `v${manifest.node}`));
          console.log(`node=${newer.some(({ security }) => security) ? newer[0].version.slice(1) : ''}`);
          EOF

  release:
    needs: check
    if: needs.check.outputs.node
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      node: ${{ needs.check.outputs.node }}
