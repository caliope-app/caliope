# Runs the tests on every push.
name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - name: Tests
        run: node --test --test-concurrency=1 "test/*.test.js"
